<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cfmon.de</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars"></div>
  <div class="stars stars2"></div>
  <div class="stars stars3"></div>

  <div class="planet planet-big">
    <svg viewBox="0 0 10 8" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="3" y="0" width="4" height="1" fill="#d06bc0"/>
      <rect x="2" y="1" width="6" height="1" fill="#d06bc0"/>
      <rect x="1" y="2" width="8" height="1" fill="#d06bc0"/>
      <rect x="0" y="3" width="10" height="2" fill="#9d7cd8"/>
      <rect x="1" y="5" width="8" height="1" fill="#9d7cd8"/>
      <rect x="2" y="6" width="6" height="1" fill="#d06bc0"/>
      <rect x="3" y="7" width="4" height="1" fill="#d06bc0"/>
      <rect x="3" y="2" width="3" height="1" fill="#b996e8"/>
      <rect x="5" y="4" width="3" height="1" fill="#d06bc0"/>
    </svg>
  </div>

  <div class="planet planet-small">
    <svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="2" y="0" width="4" height="1" fill="#4ecfd8"/>
      <rect x="1" y="1" width="6" height="1" fill="#4ecfd8"/>
      <rect x="0" y="2" width="8" height="4" fill="#4ecfd8"/>
      <rect x="1" y="6" width="6" height="1" fill="#4ecfd8"/>
      <rect x="2" y="7" width="4" height="1" fill="#4ecfd8"/>
      <rect x="2" y="2" width="2" height="2" fill="#221146"/>
      <rect x="5" y="4" width="2" height="2" fill="#221146"/>
    </svg>
  </div>

  <div class="astronaut">
    <svg viewBox="0 0 12 16" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="4" y="0" width="4" height="1" fill="#cdd8e8"/>
      <rect x="3" y="1" width="6" height="5" fill="#cdd8e8"/>
      <rect x="4" y="2" width="3" height="3" fill="#221146"/>
      <rect x="6" y="3" width="1" height="2" fill="#4ecfd8"/>
      <rect x="4" y="6" width="4" height="1" fill="#d06bc0"/>
      <rect x="2" y="7" width="8" height="5" fill="#cdd8e8"/>
      <rect x="4" y="8" width="4" height="3" fill="#d06bc0"/>
      <rect x="1" y="8" width="1" height="2" fill="#cdd8e8"/>
      <rect x="10" y="8" width="1" height="2" fill="#cdd8e8"/>
      <rect x="4" y="12" width="1" height="2" fill="#cdd8e8"/>
      <rect x="7" y="12" width="1" height="2" fill="#cdd8e8"/>
      <rect x="3" y="14" width="2" height="1" fill="#4ecfd8"/>
      <rect x="7" y="14" width="2" height="1" fill="#4ecfd8"/>
    </svg>
  </div>

  <main>
    <h1 class="welcome">WELCOME</h1>
    <p class="subtitle">cfmon.de</p>

    <div class="panel">
      <div class="panel-header">INFOS</div>
      <div class="panel-body">
        <p>Hier entsteht Inhalt.</p>
      </div>
    </div>

    <footer>cfmon.de</footer>
  </main>
</body>
</html>
